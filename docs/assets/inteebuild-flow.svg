<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="620" viewBox="0 0 1600 620">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <circle id="packet" r="5" fill="#67e8f9" filter="url(#glow)"/>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>

  <!-- Brillos ambientales -->
  <circle cx="180" cy="100" r="100" fill="#0ea5e9" opacity=".08" filter="url(#soft)">
    <animate attributeName="opacity" values=".04;.12;.04" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1400" cy="500" r="130" fill="#6366f1" opacity=".07" filter="url(#soft)">
    <animate attributeName="opacity" values=".03;.10;.03" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Encabezado -->
  <text x="80" y="70" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="32" font-weight="700">InteeBuild - Illustration done by AI</text>
  <text x="80" y="102" fill="#94a3b8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16">Web &#8594; Native Android &#8594; Cloud Build</text>

  <!-- Conexiones -->
  <g fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity=".65">
    <path id="p1" d="M200 300 H344"/>
    <path id="p2" d="M464 300 H608"/>
    <path id="p3" d="M728 300 H872"/>
    <path id="p4" d="M992 300 H1136"/>
    <path id="p5" d="M1256 300 H1400"/>
  </g>

  <!-- Paquetes animados -->
  <use href="#packet" xlink:href="#packet"><animateMotion dur="2.5s" repeatCount="indefinite" begin="0s"><mpath href="#p1" xlink:href="#p1"/></animateMotion></use>
  <use href="#packet" xlink:href="#packet"><animateMotion dur="2.5s" repeatCount="indefinite" begin=".5s"><mpath href="#p2" xlink:href="#p2"/></animateMotion></use>
  <use href="#packet" xlink:href="#packet"><animateMotion dur="2.5s" repeatCount="indefinite" begin="1s"><mpath href="#p3" xlink:href="#p3"/></animateMotion></use>
  <use href="#packet" xlink:href="#packet"><animateMotion dur="2.5s" repeatCount="indefinite" begin="1.5s"><mpath href="#p4" xlink:href="#p4"/></animateMotion></use>
  <use href="#packet" xlink:href="#packet"><animateMotion dur="2.5s" repeatCount="indefinite" begin="2s"><mpath href="#p5" xlink:href="#p5"/></animateMotion></use>

  <!-- STUDIO -->
  <g transform="translate(80 240)">
    <rect width="120" height="120" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="32" y="30" width="56" height="42" rx="6" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <path d="M32 43 H88" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="40" cy="37" r="2" fill="#67e8f9"/>
    <circle cx="48" cy="37" r="2" fill="#67e8f9"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">STUDIO</text>
  </g>

  <!-- ANALYZER -->
  <g transform="translate(344 240)">
    <rect width="120" height="120" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="57" cy="52" r="17" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <path d="M70 65 L84 79" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">ANALYZER</text>
  </g>

  <!-- CONFIG -->
  <g transform="translate(608 240)">
    <rect width="120" height="120" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M32 42 H88 M32 58 H88 M32 74 H88" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="42" r="5" fill="#67e8f9"/>
    <circle cx="72" cy="58" r="5" fill="#67e8f9"/>
    <circle cx="57" cy="74" r="5" fill="#67e8f9"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">CONFIG</text>
  </g>

  <!-- GITHUB -->
  <g transform="translate(872 240)">
    <rect width="120" height="120" rx="20" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <path d="M60 34 L82 56 L60 78 L38 56 Z" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="60" cy="34" r="5" fill="#93c5fd"/>
    <circle cx="82" cy="56" r="5" fill="#93c5fd"/>
    <circle cx="60" cy="78" r="5" fill="#93c5fd"/>
    <circle cx="38" cy="56" r="5" fill="#93c5fd"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">GITHUB</text>
  </g>

  <!-- ACTIONS -->
  <g transform="translate(1136 240)">
    <rect width="120" height="120" rx="20" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <path d="M38 66 C38 50 50 40 64 40 C78 40 86 50 86 62 C86 76 76 84 62 84 H48" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M45 77 L36 68 L45 59" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">ACTIONS</text>
  </g>

  <!-- OUTPUT -->
  <g transform="translate(1400 240)">
    <rect width="120" height="120" rx="20" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
    <path d="M38 48 L60 36 L82 48 L60 60 Z" fill="none" stroke="#4ade80" stroke-width="3"/>
    <path d="M38 48 V73 L60 86 L82 73 V48" fill="none" stroke="#4ade80" stroke-width="3"/>
    <path d="M60 60 V86" stroke="#4ade80" stroke-width="3"/>
    <text x="60" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">APK / AAB</text>
  </g>

  <!-- Barra de pipeline -->
  <g transform="translate(80 470)">
    <rect width="1440" height="70" rx="18" fill="#020617" stroke="#1e293b"/>

    <circle cx="35" cy="35" r="7" fill="#4ade80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="41" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">BUILD PIPELINE</text>

    <text x="620" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Analyze</text>
    <text x="705" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">&#8594;</text>
    <text x="790" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Configure</text>
    <text x="875" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">&#8594;</text>
    <text x="960" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Build</text>
    <text x="1045" y="41" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">&#8594;</text>
    <text x="1130" y="41" text-anchor="middle" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Output</text>
  </g>

</svg>
