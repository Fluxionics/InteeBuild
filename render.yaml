services:
  - type: web
    name: inteebuild
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: INTEE_BUILDS_REPO
        sync: false
      - key: INTEE_DEFAULT_BRANCH
        value: main
      - key: PORT
        value: "8787"